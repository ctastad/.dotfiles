# Core settings
set-option -g assume-paste-time 1
set-option -g base-index 1
set-window-option -g pane-base-index 1
set-option -g bell-action any
set-option -g default-shell "$SHELL"
set-option -g default-command "$SHELL -l"
set-option -g destroy-unattached off
set-option -g detach-on-destroy on

# Display and timing
set-option -g display-panes-active-colour red
set-option -g display-panes-colour blue
set-option -g display-panes-time 4000
set-option -g display-time 750
set-option -g history-limit 10000
set-option -g lock-after-time 0
set-option -g lock-command "lock -np"

# Style settings
set-option -g message-command-style fg=yellow,bg=black
set-option -g message-style fg=black,bg=yellow
set-option -g pane-border-style fg=colour8
set-option -g pane-active-border-style fg=blue

# User interface
set-option -g mouse on
setw -g mode-keys vi
set-option -g prefix M-w
set-option -g renumber-windows on
set-option -g repeat-time 500

# Window title
set-option -g set-titles on
set-option -g set-titles-string "#S:#I:#W - "#T" #{session_alerts}"

# Status bar
set-option -g status on
set-option -g status-interval 15
set-option -g status-justify left
set-option -g status-keys emacs
set-option -g status-left "[#S] "
set-option -g status-left-length 10
set-option -g status-left-style default
set-option -g status-position bottom
set-option -g status-right " %H:%M "
set-option -g status-right-length 40
set-option -g status-right-style default
set-option -g status-style bg=colour8

# Environment
set-option -g update-environment "DISPLAY SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY SRC_ENDPOINT SRC_ACCESS_TOKEN"
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off
set-option -g word-separators " -_@"

# Terminal settings
set-option -g default-terminal "screen-256color"
set-option -sg escape-time 10
set-option -g focus-events on

# Replace terminal-overrides with terminal-features for modern tmux
set-option -sa terminal-overrides ",*256col*:Tc"
set-option -ga terminal-features ",*:RGB"

# Clipboard
set-option -g set-clipboard on

# Smart pane navigation with awareness of Vim splits
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-M-h' if-shell "$is_vim" 'send-keys C-M-h'  'select-pane -L'
bind-key -n 'C-M-j' if-shell "$is_vim" 'send-keys C-M-j'  'select-pane -D'
bind-key -n 'C-M-k' if-shell "$is_vim" 'send-keys C-M-k'  'select-pane -U'
bind-key -n 'C-M-l' if-shell "$is_vim" 'send-keys C-M-l'  'select-pane -R'

# Unbind default ctrl-hjkl bindings
unbind-key -n C-h
unbind-key -n C-j
unbind-key -n C-k
unbind-key -n C-l


# Also keep the original key bindings without Ctrl
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
bind-key -n 'M-S-Left' if-shell "$is_vim" 'send-keys M-S-Left'  'resize-pane -L 5'
bind-key -n 'M-S-Down' if-shell "$is_vim" 'send-keys M-S-Down'  'resize-pane -D 5'
bind-key -n 'M-S-Up' if-shell "$is_vim" 'send-keys M-S-Up'  'resize-pane -U 5'
bind-key -n 'M-S-Right' if-shell "$is_vim" 'send-keys M-S-Right'  'resize-pane -R 5'

# Cross-platform clipboard support
if-shell "uname | grep -q Darwin" {
    bind-key -T copy-mode-vi v send-keys -X begin-selection
    bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
    bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
} {
    bind-key -T copy-mode-vi v send-keys -X begin-selection
    bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
    bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
}

# Window/pane management
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}" -v
bind % split-window -c "#{pane_current_path}" -h

